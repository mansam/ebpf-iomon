apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ebpf-iomon
  namespace: ebpf-iomon
  labels:
    app.kubernetes.io/name: ebpf-iomon
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ebpf-iomon
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ebpf-iomon
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: ebpf-iomon
      hostPID: true
      hostNetwork: false
      tolerations:
        - operator: Exists
      containers:
        - name: agent
          image: quay.io/slucidi/ebpf-iomon:latest
          args:
            - --metrics-port=9090
            - --scan-interval=30
            - --enable-block=true
            - --enable-nfs=true
            - --enable-nfs-kprobe=true
            - --log-level=info
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          securityContext:
            runAsUser: 0
            capabilities:
              add:
                - BPF
                - PERFMON
                - SYS_RESOURCE
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: sys
              mountPath: /sys
              mountPropagation: HostToContainer
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: sys
          hostPath:
            path: /sys
            type: Directory
